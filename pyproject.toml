[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hod_2d"
version = "0.1.0"
description = "A fast, pure-NumPy 2D Extended HOD library for Simulation-Based Inference."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "astropy>=5.0"
]